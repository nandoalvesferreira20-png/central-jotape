<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Redefinir senha | Painel Central Jotapê</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/admin/reset-password.js"></script>
</head>
<body>
  <main class="login-wrap">
    <a class="brand" href="../index.html">Central Jotapê MC</a>
    <section class="panel" aria-labelledby="reset-title">
      <h1 id="reset-title">Redefinir senha</h1>
      <p class="muted">Escolha uma nova senha para sua conta.</p>
      <p class="notice" data-message role="status" aria-live="polite">Verificando link de recuperação…</p>
      <form id="reset-form" hidden novalidate>
        <fieldset disabled>
          <div class="field"><label for="new-password">Nova senha</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-help"></div>
          <p class="help" id="password-help">Use pelo menos 8 caracteres.</p>
          <div class="field"><label for="confirm-password">Confirmar nova senha</label><input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="8" required></div>
          <button type="button" class="secondary" data-toggle-password aria-pressed="false">Mostrar senhas</button>
          <button type="submit">ATUALIZAR SENHA</button>
        </fieldset>
      </form>
      <a href="login.html#recovery" data-new-link hidden>SOLICITAR NOVO LINK</a>
      <noscript><p>Ative o JavaScript para redefinir sua senha.</p></noscript>
    </section>
    <a href="login.html">← Voltar ao login</a>
  </main>
</body>
</html>
