  <header class="journey-header">
    <a class="journey-brand" href="index.html">CENTRAL JOTAPÊ</a>
    <nav aria-label="Navegação principal">
      <a href="index.html">Início</a><a href="noticias.html">Notícias</a>
      <a href="trajetoria-2026.html">Trajetória 2026</a><a href="galeria.html" aria-current="page">Galeria</a>
    </nav>
  </header>
  <main id="main" class="journey-main gallery-main">
    <section class="gallery-intro" aria-labelledby="gallery-title">
      <p class="journey-label">CENTRAL / ARQUIVO VISUAL</p>
      <h1 id="gallery-title">Galeria Jotapê</h1>
      <p>O olhar, o gesto, os detalhes. Jotapê em retratos.</p>
    </section>
    <section class="gallery-carousel" aria-label="Fotos de Jotapê" aria-roledescription="carrossel" tabindex="0">
      <div class="gallery-stage" data-gallery></div>
      <p class="gallery-active-caption" data-active-caption hidden></p>
      <div class="gallery-carousel-controls">
        <button type="button" data-carousel-previous aria-label="Foto anterior no carrossel">←</button>
        <span data-carousel-count role="status" aria-live="polite" aria-atomic="true"></span>
        <button type="button" data-carousel-next aria-label="Próxima foto no carrossel">→</button>
      </div>
    </section>
    <noscript><p>Ative o JavaScript para explorar a galeria e ampliar as fotografias.</p></noscript>
  </main>
  <dialog class="gallery-lightbox" aria-label="Visualizador de fotografias">
    <div class="gallery-lightbox-content">
      <button class="gallery-close" type="button" aria-label="Fechar fotografia">Fechar ×</button>
      <figure><img data-full-image alt=""><figcaption data-gallery-caption aria-live="polite"></figcaption></figure>
      <div class="gallery-controls">
        <button type="button" data-previous aria-label="Fotografia anterior">← Anterior</button>
        <span data-gallery-count aria-hidden="true"></span>
        <button type="button" data-next aria-label="Próxima fotografia">Próxima →</button>
      </div>
    </div>
  </dialog>
